name: secret_exfil
events:
  - type: agent_launch
    process:
      pid: 300
      start_time: 2000
    command:
      - cat
      - /home/user/.ssh/id_rsa
    at: 1

  - type: pipe
    process:
      pid: 300
      start_time: 2000
    pipe: 2
    read_fd: 4
    write_fd: 5
    at: 2

  - type: fork
    parent:
      pid: 300
      start_time: 2000
    child:
      pid: 301
      start_time: 2010
    at: 3

  - type: dup
    process:
      pid: 301
      start_time: 2010
    from_fd: 4
    to_fd: 0
    at: 4

  - type: open
    process:
      pid: 300
      start_time: 2000
    fd: 3
    path: /home/user/.ssh/id_rsa
    at: 5

  - type: read
    process:
      pid: 300
      start_time: 2000
    fd: 3
    len: 256
    at: 6

  - type: write
    process:
      pid: 300
      start_time: 2000
    fd: 5
    len: 256
    at: 7

  - type: read
    process:
      pid: 301
      start_time: 2010
    fd: 0
    len: 256
    at: 8

  - type: connect
    process:
      pid: 301
      start_time: 2010
    fd: 6
    endpoint:
      host: evil.example
      port: 443
    at: 9

  - type: send
    process:
      pid: 301
      start_time: 2010
    fd: 6
    len: 256
    at: 10
