name: false_positive_secret_then_unrelated_send
# Human-readable shell shape:
# fixtures/agents/false_positive_secret_then_unrelated_send.sh
events:
  - type: agent_launch
    process:
      pid: 900
      start_time: 8000
    command:
      - python3
      - agent_reads_secret_then_sends_constant.py
    at: 1

  - type: open
    process:
      pid: 900
      start_time: 8000
    fd: 3
    path: /home/user/.ssh/id_rsa
    at: 2

  - type: read
    process:
      pid: 900
      start_time: 8000
    fd: 3
    len: 128
    at: 3

  - type: connect
    process:
      pid: 900
      start_time: 8000
    fd: 4
    endpoint:
      host: telemetry.example
      port: 443
    at: 4

  # False-positive shape: the process sends unrelated constant telemetry.
  # Flowguard still blocks because MVP labels are process-level, not byte-level.
  - type: send
    process:
      pid: 900
      start_time: 8000
    fd: 4
    len: 2
    at: 5
