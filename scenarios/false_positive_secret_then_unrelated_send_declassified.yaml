name: false_positive_secret_then_unrelated_send_declassified
# Explicit approved declassification boundary for the coarse-taint false-positive shape.
events:
  - type: agent_launch
    process:
      pid: 901
      start_time: 8001
    command:
      - python3
      - agent_reads_secret_then_sends_constant.py
    at: 1

  - type: open
    process:
      pid: 901
      start_time: 8001
    fd: 3
    path: /home/user/.ssh/id_rsa
    at: 2

  - type: read
    process:
      pid: 901
      start_time: 8001
    fd: 3
    len: 128
    at: 3

  - type: declassification_granted
    process:
      pid: 901
      start_time: 8001
    reason: approved constant telemetry after secret was discarded
    at: 4

  - type: connect
    process:
      pid: 901
      start_time: 8001
    fd: 4
    endpoint:
      host: telemetry.example
      port: 443
    at: 5

  - type: send
    process:
      pid: 901
      start_time: 8001
    fd: 4
    len: 2
    at: 6
